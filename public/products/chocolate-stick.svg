<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-choco" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f7f2ef"/>
      <stop offset="100%" stop-color="#ebd9cf"/>
    </radialGradient>
    <linearGradient id="choco-bar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a3825"/>
      <stop offset="50%" stop-color="#3d2314"/>
      <stop offset="100%" stop-color="#2a160a"/>
    </linearGradient>
    <linearGradient id="wood-stick" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dfc097"/>
      <stop offset="50%" stop-color="#eed7b6"/>
      <stop offset="100%" stop-color="#cda87a"/>
    </linearGradient>
    <filter id="soft-shadow-stick" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#2a160a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" rx="32" fill="url(#bg-choco)"/>

  <!-- Ground Shadow -->
  <ellipse cx="200" cy="355" rx="75" ry="14" fill="#2a160a" opacity="0.12"/>

  <!-- Popsicle Group -->
  <g filter="url(#soft-shadow-stick)">
    <!-- Wooden Stick -->
    <rect x="184" y="240" width="32" height="105" rx="16" fill="url(#wood-stick)" stroke="#b89363" stroke-width="2"/>
    <line x1="192" y1="260" x2="192" y2="330" stroke="#b89363" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

    <!-- Chocolate Bar (Rounded Top & Soft Rectangular Body) -->
    <path d="M 135 150 C 135 95 265 95 265 150 L 265 245 C 265 258 254 268 240 268 L 160 268 C 146 268 135 258 135 245 Z" fill="url(#choco-bar)" stroke="#221107" stroke-width="3"/>

    <!-- Glossy Highlight Curve on left shoulder -->
    <path d="M 152 145 C 152 115 178 108 200 108" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.3"/>
    <path d="M 152 165 L 152 235" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.2"/>

    <!-- Cute bite mark or chocolate drizzle lines -->
    <!-- Crunchy Almond/Nut pieces decoration -->
    <rect x="160" y="160" width="12" height="7" rx="3" transform="rotate(15 160 160)" fill="#e9c46a"/>
    <rect x="220" y="140" width="10" height="6" rx="3" transform="rotate(-25 220 140)" fill="#f4a261"/>
    <rect x="185" y="195" width="13" height="7" rx="3" transform="rotate(40 185 195)" fill="#e9c46a"/>
    <rect x="235" y="200" width="11" height="6" rx="3" transform="rotate(-15 235 200)" fill="#f4a261"/>
    <rect x="165" y="230" width="10" height="6" rx="3" transform="rotate(20 165 230)" fill="#e9c46a"/>
    <rect x="210" y="240" width="12" height="7" rx="3" transform="rotate(-30 210 240)" fill="#f4a261"/>

    <!-- Gold Foil wrapper bottom hint -->
    <path d="M 134 250 L 138 270 L 150 264 L 165 272 L 185 264 L 205 271 L 225 263 L 245 272 L 262 264 L 266 250 Z" fill="#e9c46a" stroke="#b08930" stroke-width="1.5" opacity="0.85"/>
  </g>
</svg>
